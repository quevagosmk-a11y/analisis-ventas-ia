<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="920" viewBox="0 0 1500 920">
  <defs>
    <style>
      .bg { fill: #f7f9ff; }
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #1f2a44; }
      .system { fill: #ffffff; stroke: #8ea2c1; stroke-width: 3; }
      .zone { fill: #eef3ff; stroke: #c6d4f0; stroke-width: 2; }
      .zone-title { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #28479b; }
      .actor-label { font: 700 16px 'Segoe UI', Arial, sans-serif; fill: #1f2a44; }
      .actor-stroke { stroke: #1f2a44; stroke-width: 3; fill: none; stroke-linecap: round; }
      .usecase { fill: #ffffff; stroke: #3157c4; stroke-width: 2.5; rx: 24; ry: 24; }
      .usecase-text { font: 700 16px 'Segoe UI', Arial, sans-serif; fill: #223b83; }
      .line { stroke: #52627f; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .note { fill: #fff6d6; stroke: #d3b559; stroke-width: 2; }
      .note-text { font: 14px 'Segoe UI', Arial, sans-serif; fill: #7b5a08; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1500" height="920"/>
  <text class="title" x="750" y="56" text-anchor="middle">Diagrama de casos de uso operativo - La Séptima Estrella</text>

  <rect class="system" x="270" y="110" width="1180" height="760" rx="28"/>
  <text class="zone-title" x="310" y="145">Sistema La Séptima Estrella</text>

  <rect class="zone" x="320" y="170" width="1080" height="160" rx="18"/>
  <text class="zone-title" x="350" y="204">Acceso general</text>

  <rect class="zone" x="320" y="355" width="1080" height="250" rx="18"/>
  <text class="zone-title" x="350" y="389">Ventas e inventario</text>

  <rect class="zone" x="320" y="630" width="1080" height="190" rx="18"/>
  <text class="zone-title" x="350" y="664">Supervisión operativa</text>

  <!-- Actores -->
  <g transform="translate(105 245)">
    <circle class="actor-stroke" cx="0" cy="-40" r="22"/>
    <line class="actor-stroke" x1="0" y1="-18" x2="0" y2="40"/>
    <line class="actor-stroke" x1="-32" y1="10" x2="32" y2="10"/>
    <line class="actor-stroke" x1="0" y1="40" x2="-26" y2="85"/>
    <line class="actor-stroke" x1="0" y1="40" x2="26" y2="85"/>
    <text class="actor-label" x="0" y="118" text-anchor="middle">Usuario del sistema</text>
  </g>

  <g transform="translate(105 500)">
    <circle class="actor-stroke" cx="0" cy="-40" r="22"/>
    <line class="actor-stroke" x1="0" y1="-18" x2="0" y2="40"/>
    <line class="actor-stroke" x1="-32" y1="10" x2="32" y2="10"/>
    <line class="actor-stroke" x1="0" y1="40" x2="-26" y2="85"/>
    <line class="actor-stroke" x1="0" y1="40" x2="26" y2="85"/>
    <text class="actor-label" x="0" y="118" text-anchor="middle">Vendedor</text>
  </g>

  <g transform="translate(105 735)">
    <circle class="actor-stroke" cx="0" cy="-40" r="22"/>
    <line class="actor-stroke" x1="0" y1="-18" x2="0" y2="40"/>
    <line class="actor-stroke" x1="-32" y1="10" x2="32" y2="10"/>
    <line class="actor-stroke" x1="0" y1="40" x2="-26" y2="85"/>
    <line class="actor-stroke" x1="0" y1="40" x2="26" y2="85"/>
    <text class="actor-label" x="0" y="118" text-anchor="middle">Gerente</text>
  </g>

  <!-- Casos de uso -->
  <rect class="usecase" x="430" y="230" width="220" height="54"/>
  <text class="usecase-text" x="540" y="264" text-anchor="middle">Iniciar sesión</text>

  <rect class="usecase" x="760" y="230" width="240" height="54"/>
  <text class="usecase-text" x="880" y="264" text-anchor="middle">Gestionar perfil</text>

  <rect class="usecase" x="1090" y="230" width="250" height="54"/>
  <text class="usecase-text" x="1215" y="264" text-anchor="middle">Consultar panel principal</text>

  <rect class="usecase" x="400" y="420" width="240" height="58"/>
  <text class="usecase-text" x="520" y="456" text-anchor="middle">Registrar venta</text>

  <rect class="usecase" x="700" y="420" width="290" height="58"/>
  <text class="usecase-text" x="845" y="446" text-anchor="middle">Consultar ventas</text>
  <text class="usecase-text" x="845" y="466" text-anchor="middle">recientes</text>

  <rect class="usecase" x="1050" y="420" width="250" height="58"/>
  <text class="usecase-text" x="1175" y="456" text-anchor="middle">Consultar productos</text>

  <rect class="usecase" x="500" y="515" width="280" height="58"/>
  <text class="usecase-text" x="640" y="551" text-anchor="middle">Usar asistente IA</text>

  <rect class="usecase" x="860" y="515" width="320" height="58"/>
  <text class="usecase-text" x="1020" y="541" text-anchor="middle">Deshabilitar venta</text>
  <text class="usecase-text" x="1020" y="561" text-anchor="middle">autorizada</text>

  <rect class="usecase" x="450" y="700" width="260" height="58"/>
  <text class="usecase-text" x="580" y="736" text-anchor="middle">Gestionar productos</text>

  <rect class="usecase" x="820" y="700" width="320" height="58"/>
  <text class="usecase-text" x="980" y="726" text-anchor="middle">Consultar reportes</text>
  <text class="usecase-text" x="980" y="746" text-anchor="middle">y estadísticas</text>

  <rect class="usecase" x="1180" y="700" width="220" height="58"/>
  <text class="usecase-text" x="1290" y="726" text-anchor="middle">Autorizar deshabilitación</text>
  <text class="usecase-text" x="1290" y="746" text-anchor="middle">de venta</text>

  <!-- Conectores -->
  <line class="line" x1="138" y1="245" x2="430" y2="257"/>
  <line class="line" x1="138" y1="265" x2="760" y2="257"/>
  <line class="line" x1="138" y1="285" x2="1090" y2="257"/>

  <line class="line" x1="138" y1="485" x2="400" y2="449"/>
  <line class="line" x1="138" y1="505" x2="700" y2="449"/>
  <line class="line" x1="138" y1="525" x2="1050" y2="449"/>
  <line class="line" x1="138" y1="545" x2="500" y2="544"/>
  <line class="line" x1="138" y1="565" x2="860" y2="544"/>

  <line class="line" x1="138" y1="720" x2="450" y2="729"/>
  <line class="line" x1="138" y1="740" x2="820" y2="729"/>
  <line class="line" x1="138" y1="760" x2="1180" y2="729"/>

  <!-- Nota -->
  <rect class="note" x="1195" y="515" width="180" height="88" rx="14"/>
  <text class="note-text" x="1285" y="543" text-anchor="middle">La deshabilitación</text>
  <text class="note-text" x="1285" y="563" text-anchor="middle">requiere autorización</text>
  <text class="note-text" x="1285" y="583" text-anchor="middle">previa de gerencia.</text>
</svg>
