<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020">
  <defs>
    <style>
      .bg { fill: #f7f9ff; }
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #1f2a44; }
      .system { fill: #ffffff; stroke: #8ea2c1; stroke-width: 3; }
      .zone { fill: #eef3ff; stroke: #c6d4f0; stroke-width: 2; }
      .zone-title { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #28479b; }
      .actor-label { font: 700 16px 'Segoe UI', Arial, sans-serif; fill: #1f2a44; }
      .actor-stroke { stroke: #1f2a44; stroke-width: 3; fill: none; stroke-linecap: round; }
      .usecase { fill: #ffffff; stroke: #3157c4; stroke-width: 2.5; rx: 24; ry: 24; }
      .usecase-text { font: 700 16px 'Segoe UI', Arial, sans-serif; fill: #223b83; }
      .line { stroke: #52627f; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .note { fill: #fff6d6; stroke: #d3b559; stroke-width: 2; }
      .note-text { font: 14px 'Segoe UI', Arial, sans-serif; fill: #7b5a08; }
    </style>
    <marker id="triangle" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffffff" stroke="#52627f" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1020"/>
  <text class="title" x="800" y="56" text-anchor="middle">Diagrama de casos de uso - La Séptima Estrella</text>

  <rect class="system" x="330" y="120" width="1190" height="820" rx="28"/>
  <text class="zone-title" x="370" y="155">Sistema La Séptima Estrella</text>

  <rect class="zone" x="370" y="180" width="1110" height="150" rx="18"/>
  <text class="zone-title" x="400" y="213">Acceso y navegación</text>

  <rect class="zone" x="370" y="360" width="1110" height="280" rx="18"/>
  <text class="zone-title" x="400" y="393">Operación comercial</text>

  <rect class="zone" x="370" y="670" width="1110" height="230" rx="18"/>
  <text class="zone-title" x="400" y="703">Gestión y control</text>

  <!-- Actores -->
  <g transform="translate(115 230)">
    <circle class="actor-stroke" cx="0" cy="-40" r="22"/>
    <line class="actor-stroke" x1="0" y1="-18" x2="0" y2="40"/>
    <line class="actor-stroke" x1="-32" y1="10" x2="32" y2="10"/>
    <line class="actor-stroke" x1="0" y1="40" x2="-26" y2="85"/>
    <line class="actor-stroke" x1="0" y1="40" x2="26" y2="85"/>
    <text class="actor-label" x="0" y="118" text-anchor="middle">Usuario del sistema</text>
  </g>

  <g transform="translate(115 430)">
    <circle class="actor-stroke" cx="0" cy="-40" r="22"/>
    <line class="actor-stroke" x1="0" y1="-18" x2="0" y2="40"/>
    <line class="actor-stroke" x1="-32" y1="10" x2="32" y2="10"/>
    <line class="actor-stroke" x1="0" y1="40" x2="-26" y2="85"/>
    <line class="actor-stroke" x1="0" y1="40" x2="26" y2="85"/>
    <text class="actor-label" x="0" y="118" text-anchor="middle">Vendedor</text>
  </g>

  <g transform="translate(115 620)">
    <circle class="actor-stroke" cx="0" cy="-40" r="22"/>
    <line class="actor-stroke" x1="0" y1="-18" x2="0" y2="40"/>
    <line class="actor-stroke" x1="-32" y1="10" x2="32" y2="10"/>
    <line class="actor-stroke" x1="0" y1="40" x2="-26" y2="85"/>
    <line class="actor-stroke" x1="0" y1="40" x2="26" y2="85"/>
    <text class="actor-label" x="0" y="118" text-anchor="middle">Gerente</text>
  </g>

  <g transform="translate(115 810)">
    <circle class="actor-stroke" cx="0" cy="-40" r="22"/>
    <line class="actor-stroke" x1="0" y1="-18" x2="0" y2="40"/>
    <line class="actor-stroke" x1="-32" y1="10" x2="32" y2="10"/>
    <line class="actor-stroke" x1="0" y1="40" x2="-26" y2="85"/>
    <line class="actor-stroke" x1="0" y1="40" x2="26" y2="85"/>
    <text class="actor-label" x="0" y="118" text-anchor="middle">Administrador</text>
  </g>

  <g transform="translate(1545 770)">
    <circle class="actor-stroke" cx="0" cy="-40" r="22"/>
    <line class="actor-stroke" x1="0" y1="-18" x2="0" y2="40"/>
    <line class="actor-stroke" x1="-32" y1="10" x2="32" y2="10"/>
    <line class="actor-stroke" x1="0" y1="40" x2="-26" y2="85"/>
    <line class="actor-stroke" x1="0" y1="40" x2="26" y2="85"/>
    <text class="actor-label" x="0" y="118" text-anchor="middle">Auditor</text>
  </g>

  <!-- Generalización de actores -->
  <line class="line" x1="115" y1="355" x2="115" y2="305" marker-end="url(#triangle)"/>
  <line class="line" x1="115" y1="545" x2="115" y2="495" marker-end="url(#triangle)"/>
  <line class="line" x1="115" y1="735" x2="115" y2="685" marker-end="url(#triangle)"/>

  <!-- Casos de uso -->
  <rect class="usecase" x="455" y="252" width="220" height="52"/>
  <text class="usecase-text" x="565" y="284" text-anchor="middle">Iniciar sesión</text>

  <rect class="usecase" x="805" y="252" width="250" height="52"/>
  <text class="usecase-text" x="930" y="284" text-anchor="middle">Gestionar perfil</text>

  <rect class="usecase" x="1160" y="252" width="260" height="52"/>
  <text class="usecase-text" x="1290" y="284" text-anchor="middle">Consultar panel principal</text>

  <rect class="usecase" x="430" y="438" width="250" height="58"/>
  <text class="usecase-text" x="555" y="474" text-anchor="middle">Registrar venta</text>

  <rect class="usecase" x="760" y="438" width="320" height="58"/>
  <text class="usecase-text" x="920" y="464" text-anchor="middle">Consultar ventas</text>
  <text class="usecase-text" x="920" y="484" text-anchor="middle">recientes</text>

  <rect class="usecase" x="1170" y="438" width="250" height="58"/>
  <text class="usecase-text" x="1295" y="474" text-anchor="middle">Consultar productos</text>

  <rect class="usecase" x="560" y="550" width="280" height="58"/>
  <text class="usecase-text" x="700" y="586" text-anchor="middle">Usar asistente IA</text>

  <rect class="usecase" x="900" y="550" width="320" height="58"/>
  <text class="usecase-text" x="1060" y="576" text-anchor="middle">Deshabilitar venta</text>
  <text class="usecase-text" x="1060" y="596" text-anchor="middle">autorizada</text>

  <rect class="usecase" x="400" y="742" width="250" height="58"/>
  <text class="usecase-text" x="525" y="778" text-anchor="middle">Gestionar productos</text>

  <rect class="usecase" x="710" y="742" width="320" height="58"/>
  <text class="usecase-text" x="870" y="768" text-anchor="middle">Consultar reportes</text>
  <text class="usecase-text" x="870" y="788" text-anchor="middle">y estadísticas</text>

  <rect class="usecase" x="1040" y="742" width="220" height="58"/>
  <text class="usecase-text" x="1150" y="768" text-anchor="middle">Gestionar usuarios</text>
  <text class="usecase-text" x="1150" y="788" text-anchor="middle">y roles</text>

  <rect class="usecase" x="500" y="820" width="260" height="58"/>
  <text class="usecase-text" x="630" y="856" text-anchor="middle">Gestionar respaldos</text>

  <rect class="usecase" x="825" y="820" width="390" height="58"/>
  <text class="usecase-text" x="1020" y="846" text-anchor="middle">Autorizar deshabilitación</text>
  <text class="usecase-text" x="1020" y="866" text-anchor="middle">de venta</text>

  <rect class="usecase" x="1250" y="820" width="190" height="58"/>
  <text class="usecase-text" x="1345" y="856" text-anchor="middle">Consultar auditoría</text>

  <!-- Conectores usuario -->
  <line class="line" x1="147" y1="230" x2="455" y2="278"/>
  <line class="line" x1="147" y1="250" x2="805" y2="278"/>
  <line class="line" x1="147" y1="270" x2="1160" y2="278"/>

  <!-- Conectores vendedor -->
  <line class="line" x1="147" y1="430" x2="430" y2="467"/>
  <line class="line" x1="147" y1="450" x2="760" y2="467"/>
  <line class="line" x1="147" y1="470" x2="1170" y2="467"/>
  <line class="line" x1="147" y1="495" x2="560" y2="579"/>
  <line class="line" x1="147" y1="515" x2="900" y2="579"/>

  <!-- Conectores gerente -->
  <line class="line" x1="147" y1="620" x2="400" y2="771"/>
  <line class="line" x1="147" y1="640" x2="710" y2="771"/>
  <line class="line" x1="147" y1="660" x2="1040" y2="771"/>
  <line class="line" x1="147" y1="685" x2="500" y2="849"/>
  <line class="line" x1="147" y1="705" x2="825" y2="849"/>

  <!-- Conectores administrador y auditor -->
  <line class="line" x1="147" y1="820" x2="1250" y2="849"/>
  <line class="line" x1="1498" y1="770" x2="1440" y2="849"/>

  <!-- Notas -->
  <rect class="note" x="1265" y="518" width="175" height="86" rx="14"/>
  <text class="note-text" x="1352" y="546" text-anchor="middle">La venta solo se</text>
  <text class="note-text" x="1352" y="566" text-anchor="middle">deshabilita si fue</text>
  <text class="note-text" x="1352" y="586" text-anchor="middle">autorizada previamente.</text>

  <rect class="note" x="1270" y="705" width="170" height="82" rx="14"/>
  <text class="note-text" x="1355" y="733" text-anchor="middle">Reportes y estadísticas:</text>
  <text class="note-text" x="1355" y="753" text-anchor="middle">solo gerente y</text>
  <text class="note-text" x="1355" y="773" text-anchor="middle">administrador.</text>
</svg>
