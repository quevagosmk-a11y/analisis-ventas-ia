<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="860" viewBox="0 0 1500 860">
  <defs>
    <style>
      .bg { fill: #f7f9ff; }
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #1f2a44; }
      .system { fill: #ffffff; stroke: #8ea2c1; stroke-width: 3; }
      .zone { fill: #eef3ff; stroke: #c6d4f0; stroke-width: 2; }
      .zone-title { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #28479b; }
      .actor-label { font: 700 16px 'Segoe UI', Arial, sans-serif; fill: #1f2a44; }
      .actor-stroke { stroke: #1f2a44; stroke-width: 3; fill: none; stroke-linecap: round; }
      .usecase { fill: #ffffff; stroke: #3157c4; stroke-width: 2.5; rx: 24; ry: 24; }
      .usecase-text { font: 700 16px 'Segoe UI', Arial, sans-serif; fill: #223b83; }
      .line { stroke: #52627f; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .note { fill: #fff6d6; stroke: #d3b559; stroke-width: 2; }
      .note-text { font: 14px 'Segoe UI', Arial, sans-serif; fill: #7b5a08; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1500" height="860"/>
  <text class="title" x="750" y="56" text-anchor="middle">Diagrama de casos de uso administrativo - La Séptima Estrella</text>

  <rect class="system" x="270" y="110" width="1180" height="700" rx="28"/>
  <text class="zone-title" x="310" y="145">Sistema La Séptima Estrella</text>

  <rect class="zone" x="320" y="180" width="1080" height="170" rx="18"/>
  <text class="zone-title" x="350" y="214">Control directivo</text>

  <rect class="zone" x="320" y="380" width="1080" height="170" rx="18"/>
  <text class="zone-title" x="350" y="414">Administración del sistema</text>

  <rect class="zone" x="320" y="580" width="1080" height="160" rx="18"/>
  <text class="zone-title" x="350" y="614">Trazabilidad y revisión</text>

  <!-- Actores -->
  <g transform="translate(105 255)">
    <circle class="actor-stroke" cx="0" cy="-40" r="22"/>
    <line class="actor-stroke" x1="0" y1="-18" x2="0" y2="40"/>
    <line class="actor-stroke" x1="-32" y1="10" x2="32" y2="10"/>
    <line class="actor-stroke" x1="0" y1="40" x2="-26" y2="85"/>
    <line class="actor-stroke" x1="0" y1="40" x2="26" y2="85"/>
    <text class="actor-label" x="0" y="118" text-anchor="middle">Gerente</text>
  </g>

  <g transform="translate(105 485)">
    <circle class="actor-stroke" cx="0" cy="-40" r="22"/>
    <line class="actor-stroke" x1="0" y1="-18" x2="0" y2="40"/>
    <line class="actor-stroke" x1="-32" y1="10" x2="32" y2="10"/>
    <line class="actor-stroke" x1="0" y1="40" x2="-26" y2="85"/>
    <line class="actor-stroke" x1="0" y1="40" x2="26" y2="85"/>
    <text class="actor-label" x="0" y="118" text-anchor="middle">Administrador</text>
  </g>

  <g transform="translate(1455 660)">
    <circle class="actor-stroke" cx="0" cy="-40" r="22"/>
    <line class="actor-stroke" x1="0" y1="-18" x2="0" y2="40"/>
    <line class="actor-stroke" x1="-32" y1="10" x2="32" y2="10"/>
    <line class="actor-stroke" x1="0" y1="40" x2="-26" y2="85"/>
    <line class="actor-stroke" x1="0" y1="40" x2="26" y2="85"/>
    <text class="actor-label" x="0" y="118" text-anchor="middle">Auditor</text>
  </g>

  <!-- Casos de uso -->
  <rect class="usecase" x="520" y="240" width="320" height="58"/>
  <text class="usecase-text" x="680" y="266" text-anchor="middle">Consultar reportes</text>
  <text class="usecase-text" x="680" y="286" text-anchor="middle">y estadísticas</text>

  <rect class="usecase" x="980" y="240" width="320" height="58"/>
  <text class="usecase-text" x="1140" y="266" text-anchor="middle">Autorizar deshabilitación</text>
  <text class="usecase-text" x="1140" y="286" text-anchor="middle">de venta</text>

  <rect class="usecase" x="500" y="440" width="340" height="58"/>
  <text class="usecase-text" x="670" y="466" text-anchor="middle">Gestionar usuarios</text>
  <text class="usecase-text" x="670" y="486" text-anchor="middle">y roles</text>

  <rect class="usecase" x="980" y="440" width="260" height="58"/>
  <text class="usecase-text" x="1110" y="476" text-anchor="middle">Gestionar respaldos</text>

  <rect class="usecase" x="820" y="630" width="300" height="58"/>
  <text class="usecase-text" x="970" y="666" text-anchor="middle">Consultar auditoría</text>

  <!-- Conectores -->
  <line class="line" x1="138" y1="255" x2="520" y2="269"/>
  <line class="line" x1="138" y1="275" x2="980" y2="269"/>

  <line class="line" x1="138" y1="485" x2="500" y2="469"/>
  <line class="line" x1="138" y1="505" x2="980" y2="469"/>
  <line class="line" x1="138" y1="525" x2="820" y2="659"/>

  <line class="line" x1="1418" y1="660" x2="1120" y2="659"/>

  <!-- Nota -->
  <rect class="note" x="1140" y="390" width="240" height="94" rx="14"/>
  <text class="note-text" x="1260" y="420" text-anchor="middle">El administrador conserva</text>
  <text class="note-text" x="1260" y="444" text-anchor="middle">control general sobre</text>
  <text class="note-text" x="1260" y="468" text-anchor="middle">usuarios y respaldos.</text>
</svg>
